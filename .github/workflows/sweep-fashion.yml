name: Fashion sweep

# 2x/day, offset off the hour (spec section 12). :43 keeps this clear of
# sweep-quick.yml's :17 schedule.
on:
  schedule:
    - cron: "43 5,17 * * *"
  workflow_dispatch: {}

concurrency:
  group: sweep-fashion
  cancel-in-progress: false

jobs:
  sweep:
    # Self-hosted, deliberately. Four of the five retailers refuse GitHub's
    # hosted runners: Blinkit answered 403 on every request and every retry
    # from a US runner (2026-09-14), BigBasket and Myntra never ingested a
    # row, while the identical code collects 1,700+ offers from a residential
    # IP in India. Amazon is the only one that survives on a hosted runner.
    # This is a network-location problem, not an adapter problem -- see
    # collectors/adapters/FASHION-NOTES.md section 9.
    #
    # If the machine is asleep at the scheduled minute the run is skipped;
    # that costs one sweep, which is the trade for collecting anything at all.
    runs-on: self-hosted
    # Budgeted at ~8 min/run (spec section 12); Flipkart's slow pacing
    # (spec section 3) is the main driver of this job's runtime. Self-hosted
    # runs cost no Actions minutes, but a wedged job holds the runner.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # No actions/setup-python here, deliberately. This job runs on a
      # self-hosted runner whose toolchain we own, and setup-python downloads
      # an interpreter and then executes an unsigned setup.ps1, which a
      # sensible PowerShell execution policy (RemoteSigned) refuses. Using the
      # machine's own Python avoids the download entirely and -- the part that
      # matters -- runs the sweep on the exact interpreter the adapters were
      # verified against.
      - name: Check Python
        run: python --version

      - name: Install dependencies
        run: python -m pip install -r collectors/requirements.txt

      - name: Run fashion sweep
        env:
          WORKER_BASE_URL: ${{ secrets.WORKER_BASE_URL }}
          INGEST_KEY: ${{ secrets.INGEST_KEY }}
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          FCM_DEVICE_TOKEN: ${{ secrets.FCM_DEVICE_TOKEN }}
        run: python -m collectors.run_sweep --mode fashion
