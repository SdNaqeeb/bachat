name: Quick-commerce sweep

# Every 4 hours, offset off the hour -- GitHub delays and sometimes drops
# on-the-hour scheduled jobs under load (spec section 12). :17 keeps this
# and sweep-fashion.yml from landing in the same GitHub Actions minute.
on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch: {}

concurrency:
  group: sweep-quick
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    # Budgeted at ~6 min/run (spec section 12); timeout is generous
    # headroom so a genuinely stuck run still fails fast instead of
    # burning the monthly Actions minute budget.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r collectors/requirements.txt

      - name: Run quick-commerce sweep
        env:
          WORKER_BASE_URL: ${{ secrets.WORKER_BASE_URL }}
          INGEST_KEY: ${{ secrets.INGEST_KEY }}
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          FCM_DEVICE_TOKEN: ${{ secrets.FCM_DEVICE_TOKEN }}
        run: python -m collectors.run_sweep --mode quick
