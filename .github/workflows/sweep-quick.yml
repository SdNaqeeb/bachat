name: Quick-commerce sweep

# Every 4 hours, offset off the hour -- GitHub delays and sometimes drops
# on-the-hour scheduled jobs under load (spec section 12). :17 keeps this
# and sweep-fashion.yml from landing in the same GitHub Actions minute.
# Manual only. The cadence lives in Windows Task Scheduler on the collector
# machine ("Bachat quick sweep", every 4 hours) because these jobs need
# `runs-on: self-hosted`, and a scheduled run with no runner registered queues
# indefinitely rather than failing -- which looks like nothing happening at
# all. Kept dispatchable so the workflow still works the moment a runner is
# online. See SETUP.md Phase 3.
on:
  workflow_dispatch: {}

concurrency:
  group: sweep-quick
  cancel-in-progress: false

jobs:
  sweep:
    # Self-hosted, deliberately. Four of the five retailers refuse GitHub's
    # hosted runners: Blinkit answered 403 on every request and every retry
    # from a US runner (2026-09-14), BigBasket and Myntra never ingested a
    # row, while the identical code collects 1,700+ offers from a residential
    # IP in India. Amazon is the only one that survives on a hosted runner.
    # This is a network-location problem, not an adapter problem -- see
    # collectors/adapters/FASHION-NOTES.md section 9.
    #
    # If the machine is asleep at the scheduled minute the run is skipped;
    # that costs one sweep, which is the trade for collecting anything at all.
    runs-on: self-hosted
    # Budgeted at ~6 min/run (spec section 12); timeout is generous
    # headroom so a genuinely stuck run still fails fast. Self-hosted runs
    # cost no Actions minutes, but a wedged job still holds the runner and
    # blocks the next sweep, so the ceiling stays.
    timeout-minutes: 12
    # cmd, not PowerShell. Actions writes every `run:` block to a temp .ps1
    # and dot-sources it, so each step is subject to the machine's PowerShell
    # execution policy -- which refused them outright on this runner ("running
    # scripts is disabled on this system"), even though CurrentUser is
    # RemoteSigned and the scripts are locally generated. Rather than weaken a
    # machine-wide security setting to satisfy a shell we do not need, the
    # steps run through cmd, which has no execution-policy concept. Every
    # command here is a single-line invocation with no shell-specific syntax,
    # so nothing is given up. A non-Windows runner would need this removed.
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4

      # No actions/setup-python here, deliberately. This job runs on a
      # self-hosted runner whose toolchain we own, and setup-python downloads
      # an interpreter and then executes an unsigned setup.ps1, which a
      # sensible PowerShell execution policy (RemoteSigned) refuses. Using the
      # machine's own Python avoids the download entirely and -- the part that
      # matters -- runs the sweep on the exact interpreter the adapters were
      # verified against.
      - name: Check Python
        run: python --version

      - name: Install dependencies
        run: python -m pip install -r collectors/requirements.txt

      - name: Run quick-commerce sweep
        env:
          WORKER_BASE_URL: ${{ secrets.WORKER_BASE_URL }}
          INGEST_KEY: ${{ secrets.INGEST_KEY }}
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          FCM_DEVICE_TOKEN: ${{ secrets.FCM_DEVICE_TOKEN }}
        run: python -m collectors.run_sweep --mode quick
